<script>const D={"en":{"rooms":{"CLASS_01":{"purifier":60.3,"fan":380.9,"days":5},"CLASS_02":{"purifier":36.7,"fan":206.9,"days":6},"CLASS_03":{"purifier":126.6,"fan":316.4,"days":5},"CLASS_04":{"purifier":39.6,"fan":531.9,"days":7},"CLASS_05":{"purifier":0.8,"fan":5.7,"days":5},"CLASS_06":{"purifier":23.5,"fan":267.8,"days":7},"CLASS_07":{"purifier":112.8,"fan":375.0,"days":7},"CLASS_08":{"purifier":196.8,"fan":2.1,"days":5}},"since":"2026-09-18","until":"2026-10-07","fan_w":38,"purifier_w":7,"note":"fan_w/purifier_w = 2026-09-19 일괄 시험 실측(환풍기 약 38 W, 공기청정기 저소음 약 7 W). 9/25~10/6 plugwatch 정지로 결측."},"kr":{"CLASS_01":"1반","CLASS_02":"2반","CLASS_03":"3반","CLASS_04":"4반","CLASS_05":"5반","CLASS_06":"6반","CLASS_07":"7반","CLASS_08":"8반"}};

const PX=96/25.4, root=document.documentElement, KIND=root.dataset.kind, P=(KIND==='p'||KIND==='m'), M=(KIND==='m'), U=KIND==='p'?1.65:(KIND==='m'?0.72:1);
const cs=getComputedStyle(root), C=n=>cs.getPropertyValue(n).trim();
const K={co2:C('--co2'),co2deep:C('--co2-deep'),ink:C('--ink'),dim:C('--dim'),grid:C('--grid'),row:C('--rowline'),thr:C('--thr'),
 bar:C('--bar'),acc:C('--acc'),green:C('--green'),panel2:C('--panel2'),pur:C('--purifier'),fan:C('--fan'),blue:C('--blue'),
 rg:{clean:C('--rg-clean'),matter:C('--rg-matter'),human:C('--rg-human'),mixed:C('--rg-mixed')},
 rgbg:{clean:C('--rg-clean-bg'),matter:C('--rg-matter-bg'),human:C('--rg-human-bg'),mixed:C('--rg-mixed-bg')}};
const FS=parseFloat(getComputedStyle(document.body).fontSize);
const mm=v=>v*PX, LW=mm(P?0.85:0.55), LT=mm(P?0.4:0.26), DASH=P?'7 5':'4 3';
const NS='http://www.w3.org/2000/svg';
function E(tag,a={},parent){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(parent)parent.appendChild(e);return e;}
function T(parent,x,y,s,o={}){const e=E('text',{x,y,'text-anchor':o.a||'start','dominant-baseline':o.b||'auto',fill:o.c||K.ink,'font-weight':o.w||400},parent);
 if(o.halo){e.setAttribute('stroke','#fff');e.setAttribute('stroke-width',mm(P?1.0:0.65));e.setAttribute('paint-order','stroke');e.setAttribute('stroke-linejoin','round');}
 if(o.transform)e.setAttribute('transform',o.transform); e.textContent=s; return e;}
let _m; function tw(s,w){if(!_m)_m=E('svg',{width:10,height:10,style:'position:absolute;left:-9999px;top:0'},document.body);
 const t=E('text',{'font-weight':w||400},_m);t.textContent=s;const l=t.getComputedTextLength();_m.removeChild(t);return l;}
const fmt=n=>Math.round(n).toLocaleString('en-US');
const lin=(d0,d1,r0,r1)=>v=>r0+(v-d0)/(d1-d0)*(r1-r0);
const tm=s=>+s.slice(0,2)*60+ +s.slice(3);
const path=pts=>pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
/* 프레임: 축 라벨 폭을 실측해 플롯 사각형 산출 */
function frame(x,y,W,H,o){ const lw=o.yLabels?Math.max(...o.yLabels.map(s=>tw(s)))+FS*0.5:0;
 const left=x+(o.left||0)+lw, top=y+(o.top!=null?o.top:(o.yTitle?FS*1.85:FS*0.7)), right=x+W-(o.right!=null?o.right:FS*0.5),

 return {x0:left,x1:right,y0:top,y1:bottom,lx:x+(o.left||0)}; }
function yAxis(g,f,sy,ticks,o={}){ for(const t of ticks){const y=sy(t); E('line',{x1:f.x0,x2:f.x1,y1:y,y2:y,stroke:K.row,'stroke-width':LT},g);
  if(!o.noLabel) T(g,f.x0-FS*0.45,y,o.fmt?o.fmt(t):fmt(t),{a:'end',b:'middle',c:K.dim});}
 if(o.title) T(g,o.noLabel?f.x0:f.lx,f.y0-FS*0.95,o.title,{c:K.dim}); }
function xAxis(g,f,sx,ticks,o={}){ E('line',{x1:f.x0,x2:f.x1,y1:f.y1,y2:f.y1,stroke:K.grid,'stroke-width':LT},g);
 for(const t of ticks){const x=sx(t); E('line',{x1:x,x2:x,y1:f.y1,y2:f.y1+mm(0.8*U),stroke:K.grid,'stroke-width':LT},g);
  T(g,x,f.y1+FS*1.2,o.fmt?o.fmt(t):String(t),{a:'middle',c:K.dim});}
 if(o.title) T(g,(f.x0+f.x1)/2,f.y1+FS*1.2+FS*1.3,o.title,{a:'middle',c:K.dim}); }
function thrLine(g,f,y,label,o={}){E('line',{x1:f.x0,x2:f.x1,y1:y,y2:y,stroke:K.thr,'stroke-width':LW*0.65,'stroke-dasharray':DASH},g);
 if(label) T(g,o.x!=null?o.x:f.x1,y-FS*0.35,label,{a:o.a||'end',c:K.thr,w:600,halo:1});}
function stepArea(pts,sx,sy,base,dt){ let d='M'+sx(pts[0][0]).toFixed(1)+' '+base.toFixed(1);
 for(const [t,v] of pts) d+='L'+sx(t).toFixed(1)+' '+sy(v).toFixed(1)+'L'+sx(t+dt).toFixed(1)+' '+sy(v).toFixed(1);
 return d+'L'+sx(pts[pts.length-1][0]+dt).toFixed(1)+' '+base.toFixed(1)+'Z'; }
function bars(g,f,sx,sy,items,o={}){ // items [{x,v,label,color}]
 const bw=o.bw; for(const it of items){ const x=sx(it.x); E('rect',{x:x-bw/2,y:sy(it.v),width:bw,height:f.y1-sy(it.v),fill:it.color||K.co2,rx:mm(0.3*U)},g);
  if(it.label!=null) T(g,x,(it.ytop!=null?it.ytop:sy(it.v))-FS*0.35,it.label,{a:'middle',c:it.lc||K.ink,w:500,halo:1}); } }
/* ---------------- 1. 수업일 하루 ---------------- */
function draw_day(svg){ const W=svg.clientWidth,H=svg.clientHeight,g=E('g',{},svg);
 const co2=D.co2.map(([t,v])=>[tm(t),v]);
 const ticks=[500,1000,1500,2000], f=frame(0,0,W,H,{yLabels:ticks.map(fmt),yTitle:1,xLabels:1,right:FS*0.9});
 const sx=lin(0,1440,f.x0,f.x1), sy=lin(400,2000,f.y1,f.y0);
 yAxis(g,f,sy,ticks,{title:'CO₂ (ppm)'}); xAxis(g,f,sx,[0,4,8,12,16,20].map(h=>h*60),{fmt:m=>String(m/60).padStart(2,'0')+'시'});
 // 수업 시간대(08–16시) 띠
 E('rect',{x:sx(8*60),y:f.y0,width:sx(16*60)-sx(8*60),height:f.y1-f.y0,fill:K.panel2},g);
 T(g,sx(12*60),f.y0+FS*0.9,P?'수업 08–16시':'수업 시간 08–16시',{a:'middle',c:K.dim});
 thrLine(g,f,sy(1000),P?'1,000 ppm':'기준 1,000 ppm',{x:f.x0+FS*0.3,a:'start'});

 let d='', prev=null; for(const [t,v] of co2){ d+=(prev==null||t-prev>10?'M':'L')+sx(t).toFixed(1)+' '+sy(v).toFixed(1); prev=t; }
 E('path',{d,fill:'none',stroke:K.co2,'stroke-width':LW,'stroke-linejoin':'round','stroke-linecap':'round'},g);
 T(g,sx(12*60+52),sy(735)+FS*1.15,'점심',{a:'middle',c:K.dim,halo:1});
 T(g,sx(9*60+5),sy(1204)-FS*0.45,P?'1교시 +7 ppm/분':'1교시 740→1,204 ppm (약 7 ppm/분)',{a:'middle',c:K.dim,halo:1});
 const ax=f.x1, ay=sy(1975);
 T(g,ax,ay,'하교 후',{a:'end',c:K.dim,halo:1}); T(g,ax,ay+FS*1.2,'완만한 감소',{a:'end',c:K.dim,halo:1});
}
/* ---------------- 2. 시간대별 주중/주말 ---------------- */
function draw_hourly(svg){ const W=svg.clientWidth,H=svg.clientHeight,g=E('g',{},svg);
 const ticks=[500,1000,1500], gap=FS*1.4, lw=Math.max(...ticks.map(s=>tw(fmt(s))))+FS*0.5;
 const pw=(W-lw-gap)/2, xt=P?[0,8,16]:[0,6,12,18];
 [['weekday','주중'],['weekend','주말']].forEach(([key,name],i)=>{
  const q=D.hourly[key]; const x=i?lw+pw+gap:0; const f=frame(x,0,i?pw:pw+lw,H,{yLabels:i?null:ticks.map(fmt),yTitle:1,xLabels:1,right:FS*0.3});
  const sx=lin(0,23,f.x0,f.x1), sy=lin(350,1900,f.y1,f.y0);
  yAxis(g,f,sy,ticks,{noLabel:i,title:i?null:'CO₂ (ppm)'}); xAxis(g,f,sx,xt,{fmt:h=>h+'시'});
  const band=path(q.map(r=>[sx(r[0]),sy(r[3])]).concat(q.slice().reverse().map(r=>[sx(r[0]),sy(r[1])])))+'Z';
  E('path',{d:band,fill:K.co2,opacity:0.18},g);
  thrLine(g,f,sy(1000),i?'1,000 ppm':null,{x:f.x1-FS*0.2});
  E('path',{d:path(q.map(r=>[sx(r[0]),sy(r[2])])),fill:'none',stroke:K.co2,'stroke-width':LW,'stroke-linejoin':'round'},g);
  T(g,f.x0+FS*0.4,f.y0+FS*0.9,name,{w:700});
  if(!i){ T(g,sx(10.6),sy(1270),P?'가운데 50%':'가운데 50% 범위',{a:'middle',c:K.co2deep,halo:1}); T(g,sx(20.3),sy(640)-FS*0.45,'중앙값',{a:'middle',c:K.co2deep,halo:1,w:600}); }
  else { const cx=(f.x0+f.x1)/2; if(P) T(g,cx,sy(760),'종일 약 470 ppm',{a:'middle',c:K.dim,halo:1});
   else { T(g,cx,sy(800),'하루 종일 약 470 ppm',{a:'middle',c:K.dim,halo:1}); T(g,cx,sy(800)+FS*1.25,'(빈 교실)',{a:'middle',c:K.dim,halo:1}); } }
 });
}
/* ---------------- 3. 교실별 초과율 ---------------- */
function draw_exceed(svg){ const W=svg.clientWidth,H=svg.clientHeight,g=E('g',{},svg);
 const rows=D.table, mean=rows.reduce((a,r)=>a+r.over1000*r.n,0)/rows.reduce((a,r)=>a+r.n,0), ticks=[0,20,40];   // 표본수 가중 = 8개 교실 합산 초과율 (39.0%)
 const lbl='전체(8개 교실 합산) '+Math.round(mean)+'%';
 let kw=0; if(P&&!M){ kw=tw('08–16시')+FS*1.2; }
 const f=frame(0,0,W-kw,H,{yLabels:ticks.map(String),yTitle:1,xLabels:1,right:P?FS*0.4:tw(lbl,600)+FS*0.8});
 const sx=lin(-0.5,rows.length-0.5,f.x0,f.x1), sy=lin(0,53,f.y1,f.y0), bw=(f.x1-f.x0)/rows.length*0.6;
 yAxis(g,f,sy,ticks,{title:M?'주중 08–16시, %':'1,000 ppm 초과 비율 (%)'}); xAxis(g,f,sx,rows.map((r,i)=>i),{fmt:i=>D.kr[rows[i].room]});
 bars(g,f,sx,sy,rows.map((r,i)=>({x:i,v:r.over1000,label:M?null:Math.round(r.over1000)})),{bw});
 const ym=sy(mean); E('line',{x1:f.x0,x2:f.x1+FS*0.5,y1:ym,y2:ym,stroke:K.ink,'stroke-width':LW*0.6,'stroke-dasharray':DASH},g);
 if(P&&!M){ const kx=f.x1+kw-FS*0.2, ky=f.y0-FS*0.2;
  T(g,kx,ky,'8개 교실',{a:'end',c:K.dim,b:'hanging'}); T(g,kx,ky+FS*1.25,'합산',{a:'end',c:K.dim,b:'hanging'});
  const t=T(g,kx,ky+FS*2.7,Math.round(mean)+'%',{a:'end',b:'hanging',w:700}); t.setAttribute('style','font-size:calc(var(--fs-t)*1.5);letter-spacing:-0.02em');
  T(g,kx,ky+FS*5.4,'주중',{a:'end',c:K.dim,b:'hanging'}); T(g,kx,ky+FS*6.65,'08–16시',{a:'end',c:K.dim,b:'hanging'}); }
 else if(M) T(g,f.x0+FS*0.3,ym-FS*0.5,'합산 '+Math.round(mean)+'%',{w:700,halo:1});
 else T(g,f.x1+FS*0.7,ym,lbl,{b:'middle',w:600});
}
/* ---------------- 4. 재실–CO₂ ---------------- */
function occPanel(g,x,y,W,H,o={}){ const S=D.sc, ticks=[1000,2000,3000,4000,5000];
 const f=frame(x,y,W,H,{yLabels:ticks.map(fmt),yTitle:1,xLabels:1,xTitle:1,right:FS*0.6});
 const sx=lin(-0.5,S.xmax+0.5,f.x0,f.x1), sy=lin(350,5400,f.y1,f.y0), slot=(f.x1-f.x0)/(S.xmax+1);
 yAxis(g,f,sy,ticks,{title:'CO₂ (ppm)'}); xAxis(g,f,sx,[0,1,2,3,4],{fmt:v=>P?String(v):v+'명',title:o.xTitle||'탐지 재실 인원 (명) · 1반, n = '+fmt(S.n_total)});
 let seed=7; const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
 const pg=E('g',{fill:K.co2,opacity:0.3},g), r=mm(P?0.45:0.32);
 for(const [a,b] of S.points){ E('circle',{cx:sx(a)+(rnd()-0.5)*slot*0.62,cy:sy(b),r},pg); }
 const y0=S.icpt, y1=S.icpt+S.slope*S.xmax;
 E('line',{x1:sx(0),x2:sx(S.xmax),y1:sy(y0),y2:sy(y1),stroke:K.ink,'stroke-width':LW},g);
 T(g,sx(S.xmax)+FS*0.3,sy(y1)-FS*1.8,'탐지 1명당 +'+Math.round(S.slope)+' ppm',{a:'end',w:700,halo:1});
 T(g,sx(S.xmax)+FS*0.3,sy(y1)-FS*0.6,(P?'':'회귀선, ')+'ρ = '+S.rho.toFixed(2),{a:'end',c:K.dim,halo:1});
}
function ratePanel(g,x,y,W,H){ const rooms=Object.keys(D.rates), ticks=[0,2,4,6,8,10];
 const f=frame(x,y,W,H,{yLabels:ticks.map(String),yTitle:1,xLabels:1,xTitle:1,right:FS*0.4});
 const sx=lin(-0.5,rooms.length-0.5,f.x0,f.x1), sy=lin(0,10,f.y1,f.y0), bw=(f.x1-f.x0)/rooms.length*0.55;
 yAxis(g,f,sy,ticks,{title:P?'상승률 (ppm/분)':'CO₂ 상승률 (ppm/분·탐지 1명당)'}); xAxis(g,f,sx,rooms.map((r,i)=>i),{fmt:i=>D.kr[rooms[i]],title:P?'탐지 1명당':'재실이 늘기 시작할 때'});
 bars(g,f,sx,sy,rooms.map((r,i)=>({x:i,v:D.rates[r][0],label:D.rates[r][0].toFixed(1),ytop:sy(D.rates[r][0]+1.96*D.rates[r][1])})),{bw});
 rooms.forEach((r,i)=>{ const [m,s]=D.rates[r], xx=sx(i), ya=sy(m-1.96*s), yb=sy(m+1.96*s), cap=mm(0.9*U);
  E('line',{x1:xx,x2:xx,y1:ya,y2:yb,stroke:K.ink,'stroke-width':LT*1.3},g);
  E('line',{x1:xx-cap,x2:xx+cap,y1:yb,y2:yb,stroke:K.ink,'stroke-width':LT*1.3},g); E('line',{x1:xx-cap,x2:xx+cap,y1:ya,y2:ya,stroke:K.ink,'stroke-width':LT*1.3},g); });
 if(!P) T(g,f.x0+FS*0.3,f.y0+FS*0.9,'오차막대 ±1.96 sd',{c:K.dim});
}
function draw_occ(svg){ const W=svg.clientWidth,H=svg.clientHeight,g=E('g',{},svg);
 if(P){ occPanel(g,0,0,W,H,{xTitle:'탐지 재실 인원 (명) · 1반, n = '+fmt(D.sc.n_total)}); }   // 포스터는 산점 패널만 크게
 else { const lw=W*0.56; occPanel(g,0,0,lw,H); ratePanel(g,lw+FS*1.2,0,W-lw-FS*1.2,H); }
}
/* ---------------- 5. 레짐 평면 ---------------- */
function draw_regime(svg){ const W=svg.clientWidth,H=svg.clientHeight,g=E('g',{},svg);
 const R=D.regime, lo=R.lo, hi=R.hi, n=R.n, th=R.threshold, ticks=[-1,0,1,2,3];
 const ylab=P?FS*0.3:tw('−1')+FS*0.5, yt=FS*1.3 /*rotated y title*/;
 const below=P?FS*1.3+FS*0.3:FS*1.45+FS*1.3;   // 포스터는 눈금 숫자 생략(z값은 포스터 독자에게 의미 없음), 축 이름만
 const side=Math.min(W-ylab-yt-FS*0.6, H-below-FS*0.5);
 const x0=yt+ylab, y0=FS*0.5, x1=x0+side, y1=y0+side;
 const s=lin(lo,hi,0,side), sx=v=>x0+s(v), sy=v=>y1-s(v), cell=side/n;
 const qs=[['clean',lo,th,lo,th],['human',th,hi,lo,th],['matter',lo,th,th,hi],['mixed',th,hi,th,hi]];
 for(const [k,a,b,c,d] of qs) E('rect',{x:sx(a),y:sy(d),width:sx(b)-sx(a),height:sy(c)-sy(d),fill:K.rgbg[k]},g);
 let mx=0; for(const row of R.counts) for(const v of row) if(v>mx) mx=v; const lmx=Math.log1p(mx);
 const dg=E('g',{fill:K.ink,'shape-rendering':'crispEdges'},g);
 for(let i=0;i<n;i++) for(let j=0;j<n;j++){ const c=R.counts[i][j]; if(c<3) continue;
  const u=Math.log1p(c)/lmx; E('rect',{x:(x0+i*cell).toFixed(2),y:(y1-(j+1)*cell).toFixed(2),width:cell.toFixed(2),height:cell.toFixed(2),opacity:(0.04+0.86*u*u).toFixed(3)},dg); }
 if(!P) for(const t of ticks){ T(g,x0-FS*0.4,sy(t),String(t).replace('-','−'),{a:'end',b:'middle',c:K.dim}); T(g,sx(t),y1+FS*1.2,String(t).replace('-','−'),{a:'middle',c:K.dim}); }
 E('rect',{x:x0,y:y0,width:side,height:side,fill:'none',stroke:K.grid,'stroke-width':LT},g);
 E('line',{x1:sx(th),x2:sx(th),y1:y0,y2:y1,stroke:K.ink,'stroke-width':LT*1.4,'stroke-dasharray':DASH},g);
 E('line',{x1:x0,x2:x1,y1:sy(th),y2:sy(th),stroke:K.ink,'stroke-width':LT*1.4,'stroke-dasharray':DASH},g);
 T(g,(x0+x1)/2,y1+(P?FS*1.1:FS*1.2+FS*1.3),P?'CO₂ → 사람':'CO₂ (표준화) → 사람',{a:'middle',c:K.dim});
 T(g,0,0,P?'VOC → 물질':'VOC (표준화) → 물질',{a:'middle',c:K.dim,b:'hanging',transform:'translate('+(FS*0.1)+','+((y0+y1)/2)+') rotate(-90)'});
 const sh=D.share, pad=FS*0.45, L=(k,x,y,a,s1,s2)=>{ T(g,x,y,s1,{a,c:K.rg[k],w:700,halo:1}); if(s2) T(g,x,y+FS*1.2,s2,{a,c:K.rg[k],w:500,halo:1}); };
 const act={clean:'조치 없음',human:'→ 환풍기',matter:'→ 공기청정기',mixed:'→ 둘 다'}, pc=k=>P?'':' '+Math.round(sh[k])+'%';
 L('clean',x0+pad,y1-pad-(P?0:FS*1.2),'start','청정'+pc('청정'),P?null:act.clean);
 L('human',x1-pad,y1-pad-(P?0:FS*1.2),'end','인체'+pc('인체'),P?null:act.human);
 L('matter',x0+pad,y0+pad+FS*0.9,'start','물질'+pc('물질'),P?null:act.matter);
 L('mixed',x1-pad,y0+pad+FS*0.9,'end','복합'+pc('복합'),P?null:act.mixed);
 // 오른쪽 보조 패널: 점유율 가로 막대 (+ 포스터는 조치 이름)
 const px0=x1+FS*1.5, pw=W-px0-FS*0.3; if(pw>FS*5){
  const order=[['clean','청정','조치 없음'],['human','인체','환풍기 가동'],['matter','물질','공기청정기 가동'],['mixed','복합','둘 다 가동']];
  const lw2=Math.max(...order.map(o=>tw(o[1],600)))+FS*0.5, vw=tw('62%')+FS*0.3, bx0=px0+lw2, bx1=px0+pw-vw, bh=FS*1.15, rowh=P?FS*2.55:FS*1.9;
  let ty=y0; if(!P){ T(g,px0,y0+FS*0.5,'최근 30일 시간 점유율',{c:K.dim,b:'hanging'}); ty=y0+FS*2.3; }
  const sv=lin(0,70,bx0,bx1);
  order.forEach(([k,name,a],i)=>{ const yy=ty+i*rowh; const v=sh[name];
   T(g,px0,yy+bh/2,name,{b:'middle',w:600,c:K.rg[k]});
   E('rect',{x:bx0,y:yy,width:sv(v)-bx0,height:bh,fill:K.rg[k],rx:mm(0.3*U)},g);
   T(g,sv(v)+FS*0.3,yy+bh/2,Math.round(v)+'%',{b:'middle',c:K.ink});
   if(P) T(g,bx0,yy+bh+FS*1.05,'→ '+a,{c:K.dim}); });
  if(!P) T(g,px0,ty+4*rowh+FS*0.3,'전체 '+fmt(R.total)+'건',{c:K.dim,b:'hanging'});
 }
}
/* ---------------- 6. 감쇠 ---------------- */
function decayCase(g,x,y,W,H){ const c=D.dc, ymax=Math.ceil(Math.max(...c.series.map(p=>p[1]))/1000)*1000, ticks=[]; for(let v=0;v<=ymax;v+=1000) ticks.push(v);
 const f=frame(x,y,W,H,{yLabels:ticks.map(fmt),yTitle:1,xLabels:1,xTitle:!P,right:FS*0.8});
 const ts=c.series.map(p=>tm(p[0])), t0=ts[0]-3, t1=ts[ts.length-1]+3; const sx=lin(t0,t1,f.x0,f.x1), sy=lin(0,ymax,f.y1,f.y0);
 const xt=[]; for(let m=Math.ceil(t0/30)*30;m<=t1;m+=(M?60:30)) xt.push(m);
 const hhmm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
 const mo=+c.start.slice(5,7), dd=+c.start.slice(8,10);
 yAxis(g,f,sy,ticks,{title:'CO₂ (ppm)'}); xAxis(g,f,sx,xt,{fmt:hhmm,title:P?null:'시각 — '+D.kr[c.room]+', '+mo+'월 '+dd+'일 환기'});
 const st=tm(c.start.slice(11)); E('line',{x1:sx(st),x2:sx(st),y1:f.y0+FS*0.2,y2:f.y1,stroke:K.dim,'stroke-width':LT,'stroke-dasharray':'2 2'},g);
 if(!M) T(g,sx(st)+FS*0.5,f.y0+FS*0.9,'환기 시작 '+hhmm(st),{c:K.dim,halo:1});
 const ser=c.series.map(([t,v])=>[sx(tm(t)),sy(v)]);
 E('path',{d:path(ser),fill:'none',stroke:K.co2,'stroke-width':LW*0.8,'stroke-linejoin':'round'},g);
 for(const [a,b] of ser) E('circle',{cx:a,cy:b,r:mm(P?0.7:0.45),fill:K.co2},g);
 // 지수 감쇠 적합 (co2_0−baseline)·exp(−t/τ)+baseline 을 시작 시각부터 fit 마지막 시각까지 1분 간격으로 직접 계산
 // (data.json의 fit 표본은 결측 샘플(14:45) 때문에 시간축이 5분 어긋나 있어 쓰지 않음)
 const tEnd=tm(c.fit[c.fit.length-1][0]), fit=[]; for(let t=0;t<=tEnd-st;t+=1) fit.push([sx(st+t),sy((c.co2_0-c.baseline)*Math.exp(-t/c.tau)+c.baseline)]);
 E('path',{d:path(fit),fill:'none',stroke:K.ink,'stroke-width':LW*0.8,'stroke-dasharray':DASH,'stroke-linejoin':'round'},g);
 const lx=M?sx(st+40):(P?sx(st+13):sx(st+40)), ly=M?sy(ymax*0.72):(P?sy(ymax*0.30):sy(ymax*0.63));   // 보고서: 곡선 오른쪽 위 / 포스터: 곡선 아래(우상단은 KPI)
 if(M) T(g,lx,ly,'τ = '+Math.round(c.tau)+'분',{c:K.ink,w:700,halo:1}); else { T(g,lx,ly,'지수 감쇠 적합',{c:K.ink,w:700,halo:1}); T(g,lx,ly+FS*1.2,'τ = '+Math.round(c.tau)+'분',{c:K.ink,w:700,halo:1}); }
 if(!M) T(g,ser[0][0]-FS*0.3,ser[0][1]+FS*1.9,P?'측정값':'CO₂ 측정값',{c:K.co2deep,w:600,halo:1});
 const n=c.series.length; if(!M&&c.series[n-1][1]>c.series[n-3][1]+100) T(g,ser[n-2][0]-FS*0.3,ser[n-1][1]+FS*0.35,'다시 재실 →',{a:'end',c:K.dim,halo:1});
 return f;
}
function decayRooms(g,x,y,W,H){ const b=D.by_room, rooms=Object.keys(b), ticks=[0,20,40,60,80];
 const f=frame(x,y,W,H,{yLabels:ticks.map(String),yTitle:1,xLabels:1,right:FS*0.4});
 const sx=lin(-0.5,rooms.length-0.5,f.x0,f.x1), sy=lin(0,80,f.y1,f.y0), bw=(f.x1-f.x0)/rooms.length*0.62;
 yAxis(g,f,sy,ticks,{title:'교실별 τ (분)'}); xAxis(g,f,sx,rooms.map((r,i)=>i),{fmt:i=>D.kr[rooms[i]]});
 bars(g,f,sx,sy,rooms.map((r,i)=>({x:i,v:b[r],color:K.bar})),{bw});
 rooms.forEach((r,i)=>T(g,sx(i),sy(b[r])+FS*1.05,Math.round(b[r]),{a:'middle',c:K.ink,w:500,halo:1}));   // 값은 막대 안쪽 위
 const ym=sy(D.tau_med); E('line',{x1:f.x0,x2:f.x1,y1:ym,y2:ym,stroke:K.green,'stroke-width':LW*0.8},g);
 T(g,f.x0+FS*0.2,ym-FS*0.35,'전체 중앙값 '+Math.round(D.tau_med)+'분',{c:K.green,w:700,halo:1});
}
function draw_decay(svg){ const W=svg.clientWidth,H=svg.clientHeight,g=E('g',{},svg);
 if(M){ decayCase(g,0,0,W,H); }
 else if(P){ const f=decayCase(g,0,0,W,H);
  const kx=f.x1-FS*0.2, ky=f.y0+FS*0.3; const t=T(g,kx,ky,Math.round(D.tau_med)+'분',{a:'end',b:'hanging',w:700,c:K.green}); t.setAttribute('style','font-size:calc(var(--fs-t)*1.5);letter-spacing:-0.02em');
  T(g,kx,ky+FS*2.6,'τ 중앙값 · 520건',{a:'end',b:'hanging',c:K.dim}); }
 else { const lw=W*0.55; decayCase(g,0,0,lw,H); decayRooms(g,lw+FS*1.0,0,W-lw-FS*1.0,H); }
}
/* ---------------- 7. 전력 사용량 비교 ---------------- */
function energyBars(g,x,y,W,H,o={}){ const rooms=Object.keys(D.en.rooms), vals=rooms.map(r=>D.en.rooms[r]), top=Math.max(...vals.map(v=>v.purifier+v.fan));
 const step=top>400?200:100, ymax=Math.ceil(top/step)*step+step, ticks=[]; for(let v=0;v<=ymax-step*0.5;v+=step) ticks.push(v);
 const f=frame(x,y,W,H,{yLabels:ticks.map(fmt),yTitle:1,xLabels:1,right:FS*0.4});
 const sx=lin(-0.5,rooms.length-0.5,f.x0,f.x1), sy=lin(0,ymax,f.y1,f.y0), bw=(f.x1-f.x0)/rooms.length*0.62;
 yAxis(g,f,sy,ticks,{title:o.yTitle||'적산 전력량 (Wh)'}); xAxis(g,f,sx,rooms.map((r,i)=>i),{fmt:i=>M?String(i+1):D.kr[rooms[i]]});
 rooms.forEach((r,i)=>{ const v=D.en.rooms[r], xx=sx(i), yp=sy(v.purifier), yf=sy(v.purifier+v.fan);
  if(v.purifier>0) E('rect',{x:xx-bw/2,y:yp,width:bw,height:f.y1-yp,fill:K.pur},g);
  if(v.fan>0) E('rect',{x:xx-bw/2,y:yf,width:bw,height:yp-yf,fill:K.fan,rx:mm(0.3*U)},g);
  if(!M) T(g,xx,yf-FS*0.35,fmt(v.purifier+v.fan),{a:'middle',c:K.ink,w:500,halo:1}); });
 // 범례
 const lx=f.x0+FS*0.4, ly=f.y0+FS*0.3, sq=FS*0.8;
 E('rect',{x:lx,y:ly,width:sq,height:sq,fill:K.fan,rx:mm(0.25)},g); T(g,lx+sq+FS*0.35,ly+sq/2,'환풍기',{b:'middle',c:K.ink});
 const w1=tw('환풍기')+sq+FS*1.6; E('rect',{x:lx+w1,y:ly,width:sq,height:sq,fill:K.pur,rx:mm(0.25)},g); T(g,lx+w1+sq+FS*0.35,ly+sq/2,'공기청정기',{b:'middle',c:K.ink});
 return f;
}
function draw_energy(svg){ const W=svg.clientWidth,H=svg.clientHeight,g=E('g',{},svg), e=D.en;
 if(M){ energyBars(g,0,0,W,H,{yTitle:'Wh · 1~8반'}); return; }
 if(P){ const f=energyBars(g,0,0,W,H);
  const kx=f.x1-FS*0.2, ky=f.y0+FS*0.3; const t=T(g,kx,ky,'×'+Math.round(e.fan_w/e.purifier_w),{a:'end',b:'hanging',w:700,c:K.fan}); t.setAttribute('style','font-size:calc(var(--fs-t)*1.5);letter-spacing:-0.02em');
  T(g,kx,ky+FS*2.6,'환풍기 '+e.fan_w+' W · 공청기 '+e.purifier_w+' W',{a:'end',b:'hanging',c:K.dim}); return; }
 const lw=W*0.66; energyBars(g,0,0,lw,H);
 // 오른쪽: 1시간 가동 시 전력량 비교
 const x0=lw+FS*1.4, w=W-x0, ticks=[0,10,20,30,40];
 const f=frame(x0,0,w,H,{yLabels:ticks.map(String),yTitle:1,xLabels:1,xTitle:1,right:FS*0.4});
 const sx=lin(-0.5,1.5,f.x0,f.x1), sy=lin(0,45,f.y1,f.y0), bw=(f.x1-f.x0)/2*0.5;
 yAxis(g,f,sy,ticks,{title:'1시간 가동 시 (Wh)'}); xAxis(g,f,sx,[0,1],{fmt:i=>['환풍기','공기청정기'][i],title:'플러그 실측 유효전력'});
 [[0,e.fan_w,K.fan],[1,e.purifier_w,K.pur]].forEach(([i,v,c])=>{ E('rect',{x:sx(i)-bw/2,y:sy(v),width:bw,height:f.y1-sy(v),fill:c,rx:mm(0.3)},g); T(g,sx(i),sy(v)-FS*0.35,v+' Wh',{a:'middle',w:600,halo:1}); });
 T(g,sx(1),sy(20),'약 '+Math.round(e.fan_w/e.purifier_w)+'배',{a:'middle',c:K.dim,halo:1,w:600});
}
function run(fn){ const svg=document.querySelector('svg'); const go=()=>{ while(svg.firstChild) svg.removeChild(svg.firstChild); fn(svg); };
 go(); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(go); }

run(draw_energy);
</script></body></html>
