<!doctype html><html lang="ko" data-kind="r" data-w="159" data-h="58"><head><meta charset="utf-8"><link rel="stylesheet" href="../design/base.css"><style>
html,body{height:100%} body{word-break:keep-all}
/* 사이클: 4열 2행 경주로(racetrack). 위 1→4, 오른쪽으로 내려와 5→7, 왼쪽으로 올라가 다시 1 */
.fill{position:relative;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:3.6mm}
.card{position:relative;display:flex;flex-direction:column;gap:.3mm;justify-content:center}
.card .num{position:absolute;top:-1.5mm;left:-1.5mm;box-shadow:0 0 0 .45mm #fff}
.card .h{font-weight:700;margin-left:2.8mm}
.card.x{border-color:var(--rg-clean);border-width:.45mm;background:var(--rg-clean-bg)} .card.x .num{background:var(--rg-clean)}
.card.loop{border-style:dashed;border-color:var(--rg-clean);background:#fff} .card.loop .h{margin-left:0;color:var(--rg-clean)}
#ov{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
</style></head><body><div class="fig">
<div class="t">공동체 데이터 탐구 사이클 7단계와 단계별 수행 내용 <span class="sub"><span class="chip r-clean">⑥·⑦ 계획 외 확장</span></span></div>
<div class="fill">
 <div class="panel card" id="c1" data-fit="c1"><span class="num">1</span><div class="h">문제 발견</div><div>공동체의 ‘답답함’을 측정 가능한 문제로</div></div>
 <div class="panel card" id="c2" data-fit="c2"><span class="num">2</span><div class="h">측정 설계</div><div>CO₂·VOC·먼지 + 장치 전력(비용)</div></div>
 <div class="panel card" id="c3" data-fit="c3"><span class="num">3</span><div class="h">데이터 수집</div><div>센서 노드 8대, 73일 <b>157,744건</b></div></div>
 <div class="panel card" id="c4" data-fit="c4"><span class="num">4</span><div class="h">분석·모델링</div><div>시간 패턴·감쇠 적합, GMM <b>4개 레짐</b></div></div>
 <div class="panel card loop" id="c0" data-fit="c0"><div class="h">↻ 다시 ①로</div><div class="dim">제어 효과는? 전력 비용은?</div></div>
 <div class="panel card x" id="c7" data-fit="c7"><span class="num">7</span><div class="h">제안·공유</div><div>환기 수칙, 공개 대시보드·복도 키오스크</div></div>
 <div class="panel card x" id="c6" data-fit="c6"><span class="num">6</span><div class="h">확장 — 제어</div><div>플러그 <b>16대</b>, 실물과 다를 때만 명령</div></div>
 <div class="panel card" id="c5" data-fit="c5"><span class="num">5</span><div class="h">인사이트</div><div>주중 낮 <b>39%</b> 초과, 원인별 차등 대응</div></div>
 <svg id="ov"></svg>
</div></div>
<script>
const svg=document.getElementById('ov'),NS='http://www.w3.org/2000/svg';
const U=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u'))||1;
const C=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const pt=(id,s,f=.5)=>{const r=document.getElementById(id).getBoundingClientRect(),b=svg.getBoundingClientRect();const x=r.left-b.left,y=r.top-b.top,w=r.width,h=r.height;return s==='r'?[x+w,y+h*f]:s==='l'?[x,y+h*f]:s==='t'?[x+w*f,y]:[x+w*f,y+h];};
function arrow(a,b,c,o={}){const hl=6.2*U,w=1.8*U;const ang=Math.atan2(b[1]-a[1],b[0]-a[0]),cs=Math.cos(ang),s=Math.sin(ang);
 const e=[b[0]-cs*hl*.7,b[1]-s*hl*.7];const p=document.createElementNS(NS,'path');p.setAttribute('d',`M${a[0]} ${a[1]} L${e[0]} ${e[1]}`);
 p.setAttribute('stroke',c);p.setAttribute('stroke-width',w);p.setAttribute('fill','none');p.setAttribute('stroke-linecap','round');if(o.dash)p.setAttribute('stroke-dasharray',`${2.6*U} ${2.2*U}`);svg.appendChild(p);
 const h=document.createElementNS(NS,'path');h.setAttribute('d',`M${b[0]} ${b[1]} L${b[0]-cs*hl-s*hl*.6} ${b[1]-s*hl+cs*hl*.6} L${b[0]-cs*hl+s*hl*.6} ${b[1]-s*hl-cs*hl*.6} Z`);h.setAttribute('fill',c);svg.appendChild(h);}
function draw(){svg.innerHTML='';const ink=C('--ink'),mint=C('--rg-clean');
 arrow(pt('c1','r'),pt('c2','l'),ink);arrow(pt('c2','r'),pt('c3','l'),ink);arrow(pt('c3','r'),pt('c4','l'),ink);
 arrow(pt('c4','b'),pt('c5','t'),ink);arrow(pt('c5','l'),pt('c6','r'),mint);arrow(pt('c6','l'),pt('c7','r'),mint);
 arrow(pt('c7','l'),pt('c0','r'),mint,{dash:1});arrow(pt('c0','t'),pt('c1','b'),mint,{dash:1});}
draw();document.fonts.ready.then(draw);
</script></body></html>
