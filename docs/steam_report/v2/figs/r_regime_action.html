<!doctype html><html lang="ko" data-kind="r" data-w="159" data-h="56"><head><meta charset="utf-8"><link rel="stylesheet" href="../design/base.css"><style>
html,body{height:100%} body{word-break:keep-all}
.fill{display:grid;grid-template-columns:77mm 1fr;gap:3mm}
/* 2×2 레짐 평면: 가로 CO₂(사람), 세로 VOC(물질) */
.quad{display:grid;grid-template-columns:5.2mm 1fr 1fr;grid-template-rows:1fr 1fr auto;gap:1.2mm}
.ylab{grid-row:1/3;min-height:0;overflow:hidden;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;color:var(--dim);font-weight:600}
.xlab{grid-column:2/4;text-align:center;color:var(--dim);font-weight:600;line-height:1.1}
.q{display:flex;flex-direction:column;justify-content:center;gap:.35mm;border-width:.35mm;min-height:0}
.q .chip{line-height:1.1}
.q .kpi{font-size:var(--fs-t);line-height:1.2}
.q .top{display:flex;align-items:center;gap:1.6mm}
.q.clean{background:var(--rg-clean-bg);border-color:var(--rg-clean)} .q.matter{background:var(--rg-matter-bg);border-color:var(--rg-matter)}
.q.human{background:var(--rg-human-bg);border-color:var(--rg-human)} .q.mixed{background:var(--rg-mixed-bg);border-color:var(--rg-mixed)}
.q.clean .kpi{color:var(--rg-clean)} .q.matter .kpi{color:var(--rg-matter)} .q.human .kpi{color:var(--rg-human)} .q.mixed .kpi{color:var(--rg-mixed)}
.act{display:flex;align-items:center;gap:1.2mm;color:var(--dim)}
.c-fan{--rc:var(--fan)} .c-pur{--rc:var(--purifier)}
.chip{background:#fff;border-width:.3mm}
/* 운영 기준 KPI */
.kp{display:grid;grid-template-rows:auto 1fr 1fr;grid-template-columns:1fr 1fr;gap:1.4mm}
.kp .hd{grid-column:1/3;font-weight:700}
.tile{display:flex;flex-direction:column;justify-content:center;gap:.8mm;border:none;background:var(--panel2)}
.tile .lb{color:var(--dim)}
</style></head><body><div class="fig">
<div class="t">원인(레짐)에 따른 맞춤형 조치와 운영 기준 <span class="sub">비율은 최근 30일</span></div>
<div class="fill">
 <div class="quad">
  <div class="ylab">VOC · 물질 →</div>
  <div class="panel q matter" data-fit="m"><div class="top"><span class="chip r-matter">물질</span><span class="kpi">15%</span></div><div class="act">→ <span class="chip c-pur"><span class="dot"></span>공기청정기</span></div></div>
  <div class="panel q mixed" data-fit="x"><div class="top"><span class="chip r-mixed">복합</span><span class="kpi">9%</span></div><div class="act">→ <span class="chip c-fan"><span class="dot"></span>환풍기</span></div><div class="act">+ <span class="chip c-pur"><span class="dot"></span>공기청정기</span></div></div>
  <div class="panel q clean" data-fit="c"><div class="top"><span class="chip r-clean">청정</span><span class="kpi">62%</span></div><div class="act">→ 유지 (조치 없음)</div></div>
  <div class="panel q human" data-fit="h"><div class="top"><span class="chip r-human">인체</span><span class="kpi">15%</span></div><div class="act">→ <span class="chip c-fan"><span class="dot"></span>환풍기</span></div></div>
  <div class="xlab">CO₂ · 사람 →</div>
 </div>
 <div class="kp">
  <div class="hd">운영 기준</div>
  <div class="panel tile" data-fit="k1"><div class="kpi">16대</div><div class="lb">플러그 · 자동 제어</div></div>
  <div class="panel tile" data-fit="k2"><div class="kpi">1,000 / 700</div><div class="lb">환풍기 ON/OFF ppm</div></div>
  <div class="panel tile" data-fit="k3"><div class="kpi">10분</div><div class="lb">최소 가동 시간</div></div>
  <div class="panel tile" data-fit="k4"><div class="kpi">τ 42분</div><div class="lb">환기 회복 τ 중앙값</div></div>
 </div>
</div></div></body></html>
