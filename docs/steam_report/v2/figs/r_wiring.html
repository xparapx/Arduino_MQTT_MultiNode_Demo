<script>
const g=document.getElementById('cables'),NS='http://www.w3.org/2000/svg';
const W=[['#1a1d24',0],['#d9342b',0],['#ffffff',1],['#f2c200',0]];
function cable(x1,y1,x2,y2){const mx=(x1+x2)/2;
 W.forEach(([c,outline],i)=>{const a=y1-5.4+i*3.6,b=y2-5.4+i*3.6;const d=`M${x1} ${a} C${mx} ${a} ${mx} ${b} ${x2} ${b}`;
  if(outline){const o=document.createElementNS(NS,'path');o.setAttribute('d',d);o.setAttribute('fill','none');o.setAttribute('stroke','#8a929e');o.setAttribute('stroke-width','3.6');g.appendChild(o);}
  const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke',c);p.setAttribute('stroke-width','2.4');p.setAttribute('stroke-linecap','round');g.appendChild(p);});}
