<!doctype html><html lang="ko" data-kind="p" data-w="143" data-h="85"><head><meta charset="utf-8"><link rel="stylesheet" href="../design/base.css"><style>
html,body{height:100%} body{word-break:keep-all}
.fill{position:relative;display:grid;grid-template-columns:40mm 12mm 33mm 12mm 40mm;grid-template-rows:1fr 1fr;gap:3mm 0}
.box{display:flex;flex-direction:column;justify-content:center;gap:.4mm;line-height:1.25}
.box .h{font-weight:700}
#sen{grid-column:1;grid-row:1/3} #hub{grid-column:3;grid-row:1/3} #dash{grid-column:5;grid-row:1} #plug{grid-column:5;grid-row:2}
#hub{border-color:var(--ink);border-width:.7mm}
#plug{border-color:var(--rg-clean);border-width:.7mm;background:var(--rg-clean-bg)}
.co2{color:var(--co2-deep);font-weight:700} .voc{color:var(--voc);font-weight:700} .pm{color:var(--pm);font-weight:700} .fan{color:var(--fan);font-weight:700} .pur{color:var(--purifier);font-weight:700}
#ov{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
</style></head><body><div class="fig">
<div class="t"><span class="idx">2</span>측정에서 제어까지의 시스템 구성</div>
<div class="fill">
  <div class="panel box" id="sen" data-fit="sen"><div class="h">센서 노드 ×8</div><div><span class="co2">CO₂</span>·<span class="voc">VOC</span></div><div><span class="pm">먼지</span></div><div>5분 평균</div></div>
  <div class="panel box" id="hub" data-fit="hub"><div class="h">허브</div><div class="h">UNO Q</div><div>수집·저장</div><div>품질 검사</div><div>판정·제어</div></div>
  <div class="panel box" id="dash" data-fit="dash"><div class="h">대시보드·</div><div class="h">키오스크</div><div>PC·폰 조회</div><div>복도 DID</div></div>
  <div class="panel box" id="plug" data-fit="plug"><div class="h">플러그 ×16</div><div><span class="fan">환풍기</span> 8</div><div><span class="pur">공청기</span> 8</div></div>
  <svg id="ov"></svg>
</div></div>
<script>
const svg=document.getElementById('ov'),NS='http://www.w3.org/2000/svg';
const U=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u'))||1;
const C=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const FS=parseFloat(getComputedStyle(document.body).fontSize);
const rect=id=>{const r=document.getElementById(id).getBoundingClientRect(),b=svg.getBoundingClientRect();return {x:r.left-b.left,y:r.top-b.top,w:r.width,h:r.height};};
function harrow(x0,x1,y,c,o={}){const hl=6.2*U,w=1.8*U,dir=x1>x0?1:-1;const p=document.createElementNS(NS,'path');
 p.setAttribute('d',`M${x0} ${y} L${x1-dir*hl*.7} ${y}`);p.setAttribute('stroke',c);p.setAttribute('stroke-width',w);p.setAttribute('fill','none');p.setAttribute('stroke-linecap','round');if(o.dash)p.setAttribute('stroke-dasharray',`${2.6*U} ${2.2*U}`);svg.appendChild(p);
 const h=document.createElementNS(NS,'path');h.setAttribute('d',`M${x1} ${y} L${x1-dir*hl} ${y-hl*.6} L${x1-dir*hl} ${y+hl*.6} Z`);h.setAttribute('fill',c);svg.appendChild(h);
 if(o.label){const t=document.createElementNS(NS,'text');t.setAttribute('x',(x0+x1)/2);t.setAttribute('y',y+(o.below?FS*1.1:-FS*0.45));t.setAttribute('text-anchor','middle');t.setAttribute('fill',c);if(o.bold)t.setAttribute('font-weight','700');t.setAttribute('stroke','#fff');t.setAttribute('stroke-width',1.0*U*2);t.setAttribute('paint-order','stroke');t.setAttribute('stroke-linejoin','round');t.textContent=o.label;svg.appendChild(t);}}
function draw(){svg.innerHTML='';const ink=C('--ink'),mint=C('--rg-clean');const s=rect('sen'),h=rect('hub'),d=rect('dash'),p=rect('plug');
 harrow(s.x+s.w,h.x,h.y+h.h*0.5,ink,{label:'측정'});
 harrow(h.x+h.w,d.x,d.y+d.h*0.5,ink,{label:'조회'});
 harrow(h.x+h.w,p.x,p.y+p.h*0.32,mint,{label:'명령',bold:1});
 harrow(p.x,h.x+h.w,p.y+p.h*0.72,mint,{dash:1,label:'전력',bold:1,below:1});}
draw();document.fonts.ready.then(draw);
</script></body></html>
