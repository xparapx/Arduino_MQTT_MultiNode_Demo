<!doctype html><html lang="ko" data-kind="m" data-w="174" data-h="22" data-scale="3.2"><head><meta charset="utf-8"><link rel="stylesheet" href="../design/base.css"><link rel="stylesheet" href="../design/base_m.css"><style>
html,body{height:100%} body{word-break:keep-all}
.fig{padding:0;gap:0}
/* 색 블록 문법: 틴트 배경 + 왼쪽 색 띠, 테두리 없음 */
.b{border-radius:1.8mm;padding:1mm 1.6mm;display:flex;flex-direction:column;justify-content:center;gap:.3mm;line-height:1.25;min-height:0;min-width:0;border-left:1.3mm solid var(--bc,transparent)}
.b .h{font-size:var(--fs-t);font-weight:700;line-height:1.12;display:flex;align-items:center;gap:1.1mm;letter-spacing:-.01em}
.ic{width:6.7mm;height:6.7mm;flex:none;color:var(--bc,var(--ink))}
.t-co2{background:var(--co2-tint);--bc:var(--co2)} .t-voc{background:var(--voc-tint);--bc:var(--voc)}
.t-clean{background:var(--rg-clean-bg);--bc:var(--rg-clean)} .t-human{background:var(--rg-human-bg);--bc:var(--rg-human)}
.t-matter{background:var(--rg-matter-bg);--bc:var(--rg-matter)} .t-mixed{background:var(--rg-mixed-bg);--bc:var(--rg-mixed)}
.t-gray{background:var(--panel2);--bc:var(--gray)} .t-blue{background:color-mix(in srgb,var(--blue) 16%,#fff);--bc:var(--blue)}
.t-acc{background:color-mix(in srgb,var(--acc) 18%,#fff);--bc:var(--acc)}
.fan{color:var(--fan);font-weight:700} .pur{color:var(--purifier);font-weight:700}
.rg-clean{color:var(--rg-clean)} .rg-human{color:var(--rg-human)} .rg-matter{color:var(--rg-matter)} .rg-mixed{color:var(--rg-mixed)}
.lab{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.15;color:var(--dim);gap:.2mm;min-width:0}
.lab .ar{width:0;height:0;border-left:2.6mm solid var(--gray);border-top:1.9mm solid transparent;border-bottom:1.9mm solid transparent;margin:.4mm 0}
.lab .ad{width:0;height:0;border-top:2.6mm solid var(--gray);border-left:1.9mm solid transparent;border-right:1.9mm solid transparent;margin:.4mm 0}
.kpi{font-size:calc(var(--fs-t)*1.5);letter-spacing:-.03em}

.fill{display:flex;flex-direction:column;gap:1.2mm;height:100%}
.pills{display:flex;align-items:stretch;gap:0;flex:none}
.p{flex-direction:row;border-radius:5mm;padding:1.2mm 2.4mm;display:flex;align-items:center;gap:1.1mm;font-size:var(--fs-t);font-weight:700;line-height:1.1;letter-spacing:-.01em;white-space:nowrap;border-left:none}
.p .ic{width:6mm;height:6mm}
.pa{flex:1;display:flex;align-items:center;justify-content:center;min-width:3.6mm}
.gl{display:flex;flex-direction:column;gap:.5mm;justify-content:center;flex:1;min-height:0;line-height:1.25}
.gl div{display:flex;align-items:center;gap:1.2mm} .gl .ic{width:4.6mm;height:4.6mm;color:var(--red)} .gl b{color:var(--red)}</style></head><body><div class="fig">
<div class="fill">
 <div class="pills" data-fit="pills">
  <div class="b p t-gray"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="14" height="10" rx="2"/><path d="M8 7V4M12 7V4M16 7V4M8 20v-3M12 20v-3M16 20v-3M9 11h6M9 14h4"/></svg>측정 → 수집</div><div class="pa"><div class="lab"><div class="ar"></div></div></div>
  <div class="b p t-matter"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></svg>품질 검사 → 레짐 → 규칙 → 목표</div><div class="pa"><div class="lab"><div class="ar" style="border-left-color:var(--rg-clean)"></div></div></div>
  <div class="b p t-clean"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="8" rx="4"/><circle cx="16" cy="12" r="2.5"/></svg>실물 비교 → 명령</div>
 </div>
 <div class="gl" data-fit="gl">
  <div><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v5c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg><span><b>품질 검사 미통과 → 판정 생략</b>·이전 상태 유지 &nbsp;·&nbsp; 규칙 환풍기 1,000/700 ppm · 공기청정기 VOC 200/120 · 최소 10분</span></div>
  <div><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v5c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/><path d="M12 8v8" stroke-dasharray="2 2"/></svg><span><b>판정 모듈·집행 모듈 분리</b> — 플러그 실제 상태와 비교해 <b>다를 때만</b> 명령, 한쪽이 멈춰도 오동작 없음</span></div>
 </div>
</div></div></body></html>
