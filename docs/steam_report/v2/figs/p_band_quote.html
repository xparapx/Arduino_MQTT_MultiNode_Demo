<!doctype html>
<html lang="ko" data-kind="p" data-w="586" data-h="8">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../design/base.css">
<style>
  /* 맨 아래 띠(표3 (0,5) 592×9mm) 한 줄 — 타이포만. 칸이 글 칸이므로 한/글 텍스트(16–17pt) 입력을 권장하고, 이 그림은 대체용. */
  html, body { height: 100%; }
  .fig { padding: 0; gap: 0; align-items: center; justify-content: center; overflow: hidden; }
  .q { font-size: 17pt; line-height: 7.9mm; height: 7.9mm; overflow: hidden; white-space: nowrap; letter-spacing: -0.005em; text-align: center; }
  .q b { color: var(--co2-deep); }
  .q em { font-style: normal; font-weight: 700; color: var(--rg-human); }
</style>
</head>
<body>
<div class="fig">
  <div class="q">측정할 수 있으면 <b>진단</b>할 수 있고, 진단할 수 있으면 <em>해결</em>할 수 있다.</div>
</div>
</body>
</html>
