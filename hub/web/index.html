<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>교실 공기질 모니터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("aq-theme")||(matchMedia("(max-width: 899.98px)").matches?"light":"dark"))}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">multinode_aq · UNO Q (aqhub)<b>교실 공기질 모니터</b></div>
  <nav class="nav" id="nav"></nav>
  <div class="status">
    <div><span>hub.py</span><span class="v" id="st-hub">…</span></div>
    <div><span>마지막 수신</span><span class="v" id="st-last">—</span></div>
    <div><span>환경 노드</span><span class="v" id="st-env">—</span></div>
    <div><span>비전 노드</span><span class="v" id="st-vis">—</span></div>
    <div><span>readings</span><span class="v" id="st-rows">—</span></div>
  </div>
  <div class="status">
    <div><span>analyst.py</span><span class="v" id="st-analyst">—</span></div>
    <div><span>daily · weekly</span><span class="v" id="st-daily">—</span></div>
    <div><span>진단 모델</span><span class="v" id="st-model">—</span></div>
  </div>
  <div class="theme"><button data-theme="dark">다크</button><button data-theme="light">라이트</button></div>
  <div class="foot">sensor_data.db · WAL<br>readings / occupancy / analysis<br>web v0.9 · api 60 s / 5 min</div>
</aside>
<main>
  <h1>Multinode Environmental Sensing Monitor</h1>
  <p class="sub" id="sub">불러오는 중…</p>
  <nav class="subtabs" id="subtabs" role="tablist" style="display:none"></nav>
  <button id="theme-mob" class="theme-mob" aria-label="테마 전환" type="button">
    <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</main>
</div>
<nav class="dock" id="dock" role="tablist"></nav>
<script src="/static/app.js"></script>
<script src="/static/charts.js"></script>
<script src="/static/router.js"></script>
<script src="/static/screens/home.js"></script>
<script src="/static/screens/monitor.js"></script>
<script src="/static/screens/diagnosis.js"></script>
<script src="/static/screens/admin.js"></script>
<script>
AQ.initTheme(); AQ.initTip();
AQ.initSidebar(() => AQ.router.refresh());
AQ.router.start();
setTimeout(() => AQ.store.prime("/api/stats"), 2500);
</script>
</body>
</html>
