[project]
name = "multinode-aq"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.1",
    "paho-mqtt>=2.1.0",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "scikit-learn>=1.9.0",
    "streamlit>=1.58.0",
    "streamlit-autorefresh>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
# hub.py / dashboard.py are board code kept byte-identical to production (plan section 0.2);
# hub_cloud.py and en/ are legacy reference copies (docs/DRIFT.md). Lint only new code.
# aq/ui_common.py is dashboard.py code moved verbatim in Phase 5 (legacy style kept);
# new page-2 code lives in aq/plots.py and pages/, which are linted.
extend-exclude = ["hub.py", "dashboard.py", "hub_cloud.py", "en", ".venv", "aq/ui_common.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.ruff.lint.per-file-ignores]
# UI modules carry Korean captions (CJK = double width for E501); everything else applies.
"pages/*.py" = ["E501"]
"aq/plots.py" = ["E501"]
"aq/analysis_view.py" = ["E501"]
# API layer: long SQL strings and JSON-shape literals (Phase 8).
"aq/webdata.py" = ["E501"]
"webapp.py" = ["E501"]

[tool.coverage.run]
# aq/ui_common.py is the page-1 legacy code moved verbatim in Phase 5; it is
# exercised by scripts/perf_probe.py and tests/test_pages.py, not unit-tested.
omit = ["aq/ui_common.py"]
